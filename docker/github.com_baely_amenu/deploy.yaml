# Repo: https://github.com/baely/amenu
# Menu — upcoming menu for the week (menu.baileys.app)
# .env provides AMENU_AUTH_KEY and AMENU_ENCRYPT_KEY.
name: menu

services:
  menu:
    image: registry.baileys.dev/amenu:latest
    container_name: menu
    restart: unless-stopped
    env_file: ".env"
    environment:
      AMENU_DATA_FILE: /data/menu.json
    volumes:
      - amenu-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.menu.rule=Host(`menu.baileys.app`)
      - traefik.http.services.menu.loadbalancer.server.port=8080
      - baileys.public.url=https://menu.baileys.app
      - baileys.public.title=Menu
      - baileys.public.description=Upcoming menu for the week
    networks:
      - menu-net

volumes:
  amenu-data:
    external: true # pre-existing volume from the original docker run deployment

networks:
  menu-net:
    external: true
