# Repo: https://github.com/baely/uncovr
name: uncovr

services:
  uncovr:
    image: registry.baileys.dev/uncovr:latest
    container_name: uncovr
    restart: unless-stopped
    env_file: ".env"
    environment:
      PORT: "8787"
      UNCOVR_DATA_DIR: /data
    volumes:
      - uncovr-data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # Pinned to websecure: without this the router binds to every entrypoint,
      # including :80 (plaintext) and the :22 ssh entrypoint.
      - traefik.http.routers.uncovr.rule=Host(`uncovr.baileys.dev`)
      - traefik.http.routers.uncovr.entrypoints=websecure
      - traefik.http.services.uncovr.loadbalancer.server.port=8787
      # Plaintext :80 answers only with a 301 to https.
      - traefik.http.routers.uncovr-http.rule=Host(`uncovr.baileys.dev`)
      - traefik.http.routers.uncovr-http.entrypoints=web
      - traefik.http.routers.uncovr-http.middlewares=uncovr-https-redirect
      - traefik.http.middlewares.uncovr-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.uncovr-https-redirect.redirectscheme.permanent=true
    networks:
      - web

volumes:
  uncovr-data:

networks:
  web:
    external: true
