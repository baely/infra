# Self-hosted Docker registry (registry.baileys.dev)
# .env provides REGISTRY_AUTH_USERS (htpasswd/bcrypt) for the basic-auth middleware.
name: registry

services:
  registry:
    image: registry:latest
    container_name: registry
    restart: always
    volumes:
      - /home/user/registry:/var/lib/registry # registry blob storage (data lives outside the repo)
    labels:
      - traefik.enable=true
      - traefik.http.routers.registry.rule=Host(`registry.baileys.dev`)
      - traefik.http.middlewares.registry-auth.basicauth.users=${REGISTRY_AUTH_USERS}
    networks:
      - web

networks:
  web:
    external: true
