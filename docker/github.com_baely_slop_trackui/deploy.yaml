# Repo: https://github.com/baely/slop (trackui/)
# Track — enriched location dashboard (track.baileys.app)
# .env provides TRACK_TOKEN, UP_TOKEN and IBBITOT_API_KEY.
name: location

services:
  location:
    image: registry.baileys.dev/locationdashboard:latest
    container_name: location
    restart: unless-stopped
    env_file: ".env"
    environment:
      IBBITOT_URL: "https://isbaileybutlerintheoffice.today"
    labels:
      - traefik.enable=true
      - traefik.http.routers.location.rule=Host(`track.baileys.app`)
      - traefik.http.services.location.loadbalancer.server.port=8080
      - baileys.public.url=https://track.baileys.app
      - baileys.public.title=Track
      - baileys.public.description=Enriched location data
    networks:
      - web # previously on the default bridge; web keeps traefik routing

networks:
  web:
    external: true
