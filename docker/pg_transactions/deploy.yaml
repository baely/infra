# Shared Postgres instance, reachable only on the "pg" docker network
# (pg_transactions:5432). Consumers: traccar, txn.
# .env provides POSTGRES_USER / POSTGRES_PASSWORD.
name: pg_transactions

services:
  pg_transactions:
    image: postgres:16
    container_name: pg_transactions
    restart: always
    env_file: ".env"
    environment:
      POSTGRES_DB: db
    volumes:
      - pgtransactions:/var/lib/postgresql/data
    networks:
      - pg

volumes:
  pgtransactions:
    external: true # pre-existing volume from the original docker run deployment

networks:
  pg:
    name: pg
    attachable: true # allows ad-hoc `docker network connect pg <container>`
