name: ultimate-plex-stack

networks:
  web:
    external: true

services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.3.10896-cb3ebc72d-ls321
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${BASE_PATH}/plex/config:/config
      - ${MEDIA_SHARE}/media/tv:/tv
      - ${MEDIA_SHARE}/media/movies:/movies
    restart: unless-stopped

  jellyfin:
    # Upstream image, not linuxserver: 12.x isn't on lscr yet. Its database is
    # already migrated to 12.x, so going back to 10.11 needs a restore.
    image: jellyfin/jellyfin:12.0-rc5
    container_name: jellyfin
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.int.xbd.au`)"
      - "traefik.http.routers.jellyfin.middlewares=internal-only@file"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${BASE_PATH}/jellyfin/config:/config
      - ${MEDIA_SHARE}/media/tv:/data/tvshows
      - ${MEDIA_SHARE}/media/movies:/data/movies
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
    container_name: radarr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.int.xbd.au`)"
      - "traefik.http.routers.radarr.middlewares=internal-only@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/radarr/config:/config
      - ${MEDIA_SHARE}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls322
    container_name: sonarr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.int.xbd.au`)"
      - "traefik.http.routers.sonarr.middlewares=internal-only@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/sonarr/config:/config
      - ${MEDIA_SHARE}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
    container_name: prowlarr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.int.xbd.au`)"
      - "traefik.http.routers.prowlarr.middlewares=internal-only@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/prowlarr/config:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.int.xbd.au`)"
      - "traefik.http.routers.flaresolverr.middlewares=internal-only@file"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
      - "traefik.docker.network=web"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: unless-stopped

  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:v1.84.0
    restart: unless-stopped
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.autobrr.rule=Host(`autobrr.int.xbd.au`)"
      - "traefik.http.routers.autobrr.middlewares=internal-only@file"
      - "traefik.http.services.autobrr.loadbalancer.server.port=7474"
      - "traefik.docker.network=web"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${GUID}
    volumes:
      - ${BASE_PATH}/autobrr/config:/config

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: seerr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.xbd.au`)"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=web"
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ${BASE_PATH}/seer/config:/app/config
      - ${MEDIA_SHARE}:/data
    restart: unless-stopped

  qbit-vpn:
    image: binhex/arch-qbittorrentvpn:5.2.3-3-01
    container_name: qbit-vpn
    mem_limit: 6g
    memswap_limit: 6g
    networks:
      # `default` so the *arrs reach the webui by name; `web` for traefik
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbit.rule=Host(`qbit.int.xbd.au`)"
      - "traefik.http.routers.qbit.middlewares=internal-only@file"
      - "traefik.http.services.qbit.loadbalancer.server.port=8090"
      - "traefik.docker.network=web"
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=0
      - PGID=0
      - UMASK=000
      - TZ=${TZ}
      - WEBUI_PORT=8090
      - VPN_ENABLED=yes
      - VPN_USER=${VPN_USER}
      - VPN_PASS=${VPN_PASS}
      - VPN_PROV=pia
      - VPN_CLIENT=wireguard
      - STRICT_PORT_FORWARD=yes
      # docker ranges included so traefik and the *arrs (172.16.0.0/12) can reach the webui
      - LAN_NETWORK=192.168.0.0/24,172.16.0.0/12
      - ENABLE_STARTUP_SCRIPTS=no
      - NAME_SERVERS=1.1.1.1,1.0.0.1
      - ENABLE_PRIVOXY=yes
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    privileged: true
    ports:
      # webui now behind traefik (qbit.int.xbd.au); peering rides the VPN tunnel
      - 8118:8118
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${BASE_PATH}/qbittorrent/config:/config
      - ${MEDIA_SHARE}:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.17.2-ls241
    container_name: tautulli
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.int.xbd.au`)"
      - "traefik.http.routers.tautulli.middlewares=internal-only@file"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/tautulli/config:/config
    restart: unless-stopped

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest@sha256:c06d48426b612b845f2406c2d045f266468a6390faf87aea796d497a2935ec95
    container_name: decluttarr
    restart: unless-stopped
    networks:
      - default
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${GUID}

      LOG_LEVEL: INFO
      TEST_RUN: "True" # Review the logs, then flip to "False" to let it actually remove/act
      TIMER: 10

      REMOVE_FAILED_DOWNLOADS: "True"
      REMOVE_FAILED_IMPORTS: "True"
      REMOVE_METADATA_MISSING: "True"
      REMOVE_MISSING_FILES: "True"
      REMOVE_ORPHANS: "True"
      REMOVE_SLOW: "True"
      REMOVE_STALLED: "True"
      REMOVE_UNMONITORED: "True"
      DETECT_DELETIONS: "True"

      # API keys live in the server-side .env
      SONARR: >
        - base_url: "http://sonarr:8989"
          api_key: "${SONARR_API_KEY}"

      RADARR: >
        - base_url: "http://radarr:7878"
          api_key: "${RADARR_API_KEY}"

      # QBITTORRENT: add this back once you have the WebUI password (or an API key, qBit 5.2+);
      # the current admin password is PBKDF2-hashed in qBittorrent.conf and unrecoverable.
      # QBITTORRENT: >
      #   - base_url: "http://qbit-vpn:8090"
      #     username: "admin"
      #     password: "xxxx"

  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr:latest
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wizarr.rule=Host(`wizarr.int.xbd.au`)"
      - "traefik.http.routers.wizarr.middlewares=internal-only@file"
      - "traefik.http.services.wizarr.loadbalancer.server.port=5690"
      - "traefik.docker.network=web"
    volumes:
      - ${BASE_PATH}/wizarr/data/database:/data/database
    restart: unless-stopped
