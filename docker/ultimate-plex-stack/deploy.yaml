name: ultimate-plex-stack

networks:
  web:
    external: true

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${BASE_PATH}/plex/config:/config
      - ${MEDIA_SHARE}/media/tv:/tv
      - ${MEDIA_SHARE}/media/movies:/movies
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.home.baileys.app`)"
      - "traefik.http.routers.jellyfin.middlewares=internal-only@file"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${BASE_PATH}/jellyfin/config:/config
      - ${MEDIA_SHARE}/media/tv:/data/tvshows
      - ${MEDIA_SHARE}/media/movies:/data/movies
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.home.baileys.app`)"
      - "traefik.http.routers.radarr.middlewares=internal-only@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/radarr/config:/config
      - ${MEDIA_SHARE}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.home.baileys.app`)"
      - "traefik.http.routers.sonarr.middlewares=internal-only@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/sonarr/config:/config
      - ${MEDIA_SHARE}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.home.baileys.app`)"
      - "traefik.http.routers.prowlarr.middlewares=internal-only@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/prowlarr/config:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.home.baileys.app`)"
      - "traefik.http.routers.flaresolverr.middlewares=internal-only@file"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
      - "traefik.docker.network=web"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    restart: unless-stopped

  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:latest
    restart: unless-stopped
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.autobrr.rule=Host(`autobrr.home.baileys.app`)"
      - "traefik.http.routers.autobrr.middlewares=internal-only@file"
      - "traefik.http.services.autobrr.loadbalancer.server.port=7474"
      - "traefik.docker.network=web"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${GUID}
    volumes:
      - ${BASE_PATH}/autobrr/config:/config

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`request.baileys.app`)"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=web"
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ${BASE_PATH}/seer/config:/app/config
      - ${MEDIA_SHARE}:/data
    restart: unless-stopped

  qbit-vpn:
    image: binhex/arch-qbittorrentvpn:latest
    container_name: qbit-vpn
    network_mode: bridge
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=0
      - PGID=0
      - UMASK=000
      - TZ=${TZ}
      - WEBUI_PORT=8090
      - VPN_ENABLED=yes
      - VPN_USER=${VPN_USER}
      - VPN_PASS=${VPN_PASS}
      - VPN_PROV=pia
      - VPN_CLIENT=wireguard
      - STRICT_PORT_FORWARD=yes
      - LAN_NETWORK=192.168.0.0/24
      - ENABLE_STARTUP_SCRIPTS=no
      - NAME_SERVERS=1.1.1.1,1.0.0.1
      - ENABLE_PRIVOXY=yes
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    privileged: true
    ports:
      - 8090:8090
      - 8118:8118
      - 58946:58946
      - 58946:58946/udp
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${BASE_PATH}/qbittorrent/config:/config
      - ${MEDIA_SHARE}:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.home.baileys.app`)"
      - "traefik.http.routers.tautulli.middlewares=internal-only@file"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
      - "traefik.docker.network=web"
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/tautulli/config:/config
    restart: unless-stopped

  wizarr:
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr:latest
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wizarr.rule=Host(`wizarr.home.baileys.app`)"
      - "traefik.http.routers.wizarr.middlewares=internal-only@file"
      - "traefik.http.services.wizarr.loadbalancer.server.port=5690"
      - "traefik.docker.network=web"
    volumes:
      - ${BASE_PATH}/wizarr/data/database:/data/database
    restart: unless-stopped
