name: traefik

services:
  traefik:
    image: registry.baileys.dev/traefik:latest
    container_name: traefik-2
    restart: unless-stopped
    env_file: ".env"
    labels:
      - traefik.http.services.traefik.loadbalancer.server.port=8080
    ports:
      - 80:80
      - 443:443
      - 2022:22
      - 8080:8080
      - 8082:8082
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - acme:/acme
      - /home/user/github/infra/docker/traefik:/etc/traefik:ro
    networks:
      - web

volumes:
  acme:
    external: true

networks:
  web:
    external: true
