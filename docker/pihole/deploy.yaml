# Pi-hole DNS (web UI on host port 8088)
# .env provides WEBPASSWORD.
name: pihole

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    env_file: ".env"
    environment:
      TZ: Australia/Melbourne
      FTLCONF_LOCAL_IPV4: 192.168.0.82
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8088:80"
    volumes:
      - pihole:/etc/pihole
      - /etc/dnsmasq.d:/etc/dnsmasq.d
    labels:
      - traefik.http.services.pihole.loadbalancer.server.port=8088

volumes:
  pihole:
    external: true # pre-existing volume from the original docker run deployment
