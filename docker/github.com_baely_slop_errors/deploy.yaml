# Repo: https://github.com/baely/slop (errors/)
# Service-only (no router): referenced by the errors@file middleware in
# bootstrap/traefik/conf.yaml to serve custom error pages.
services:
  errors:
    image: registry.baileys.dev/errors:latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.services.errors.loadbalancer.server.port=8080
    networks:
      - web

networks:
  web:
    external: true
