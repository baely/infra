name: jumpbox

services:
  jumpbox:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: jumpbox
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Australia/Sydney
      TITLE: box.selfrun.net
    volumes:
      - webtop:/config
    labels:
      - traefik.enable=true
      # Public only via the selfrun Cloudflare Tunnel, behind Cloudflare Access
      - traefik.http.routers.jump.rule=Host(`box.selfrun.net`)
      - traefik.http.routers.jump.entrypoints=tunnel
      - traefik.http.services.jump.loadbalancer.server.port=3000
      - traefik.docker.network=web
    networks:
      web:
      pihole_dns:
        # pinned: dynamic IPAM starts at .2 and can steal pihole's static
        # 172.16.2.2 in the boot-order race (took DNS down 2026-07-30)
        ipv4_address: 172.16.2.3
    dns:
      - 172.16.2.2

volumes:
  webtop:
    external: true

networks:
  web:
    external: true
  pihole_dns:
    external: true
