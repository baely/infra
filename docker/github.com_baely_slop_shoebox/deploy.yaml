# Repo: https://github.com/baely/slop (shoebox/)
# Ref: 9dc2f6bcde3fe7ea525b9ff68706dffcbf05f8e6
name: shoebox

services:
  shoebox:
    image: registry.baileys.dev/shoebox:latest
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      SMTP_ADDR: ":2525"
      DATA_DIR: "/data"
      SMTP_DOMAIN: "shoebox.baileys.dev"
      INGEST_ADDR: "tax@baileys.dev"
      TZ: "Australia/Melbourne"
    labels:
      - traefik.enable=true
      - traefik.http.routers.shoebox.rule=Host(`shoebox.int.xbd.au`)
      - traefik.http.routers.shoebox.middlewares=internal-only@file
      - traefik.http.services.shoebox.loadbalancer.server.port=8080
      - traefik.docker.network=web
    volumes:
      - shoebox-data:/data
    networks:
      - web
      # SMTP ingest is only reachable from the mail router:
      # transport line `tax@baileys.dev smtp:[shoebox]:2525`
      - mailnet

volumes:
  shoebox-data:

networks:
  web:
    external: true
  mailnet:
    name: postfix_mailnet
    external: true
