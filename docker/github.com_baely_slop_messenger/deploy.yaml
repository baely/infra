# Repo: https://github.com/baely/slop (messenger/)
# Hermes — contact form backed by Chatwoot (hermes.baileys.app)
# .env provides CHATWOOT_API_TOKEN.
name: hermes

services:
  hermes:
    image: registry.baileys.dev/messenger:latest
    container_name: hermes
    restart: unless-stopped
    env_file: ".env"
    environment:
      CHATWOOT_URL: "https://chat.baileys.app"
      CHATWOOT_ACCOUNT_ID: "1"
      CHATWOOT_INBOX_ID: "1"
      PORT: "8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.hermes.rule=Host(`hermes.baileys.app`)
      - traefik.http.services.hermes.loadbalancer.server.port=8080
      - baileys.public.url=https://hermes.baileys.app
      - baileys.public.title=Hermes
      - baileys.public.description=Message me
    networks:
      - web # previously on the default bridge; web keeps traefik routing

networks:
  web:
    external: true
