services:
  eink:
    image: registry.baileys.dev/eink:v15
    restart: unless-stopped
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.eink.rule=Host(`timetable.baileys.dev`)
      - traefik.http.services.eink.loadbalancer.server.port=8080

networks:
  web:
    external: true
