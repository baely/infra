# Reference deployment for Studier.
#
# 1. Create a GitHub OAuth App (https://github.com/settings/developers):
#      Homepage URL:            https://study.example.com
#      Authorization callback:  https://study.example.com/auth/callback
# 2. Fill in the environment below (or use an .env file).
# 3. docker compose up -d
#
# Put a TLS-terminating reverse proxy (Caddy/Traefik/nginx) in front and set
# BASE_URL to the public https URL — session cookies are Secure when BASE_URL
# is https.

services:
  studier:
    image: registry.baileys.dev/studier:latest
    container_name: studier
    restart: unless-stopped
    #ports:
    #  - '8080:8080'
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.study.rule=Host(`study.baileys.app`)
      - traefik.http.services.study.loadbalancer.server.port=8080
    environment:
      BASE_URL: https://study.baileys.app
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set in .env}
      # Only these GitHub logins may sign in (comma-separated). Fails closed.
      ALLOWED_GITHUB_USERS: baely
      TZ: Australia/Melbourne
      # Optional tuning (defaults shown):
      # GITHUB_REPO_PREFIX: study-      # GitHub repos are named <prefix><subject-slug>
      # AUTO_PUSH_HOURS: '24'           # scheduled squash+push cadence (0 = manual only)
      # FEED_REFRESH_HOURS: '6'         # ICS feed refresh cadence
      # AUTO_COMMIT_MINUTES: '15'       # background local-commit sweep
    volumes:
      # All state lives here: per-subject git repos, calendar meta repo,
      # signing key, session secret, GitHub token. Back it up.
      - studier-data:/data
    networks:
      - web

volumes:
  studier-data:

networks:
  web:
    external: true
