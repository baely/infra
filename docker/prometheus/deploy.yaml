# Prometheus + Grafana (grafana.baileys.dev)
# .env provides GF_SECURITY_ADMIN_PASSWORD.
name: prometheus

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    env_file: ".env"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
    networks:
      - monitoring
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.baileys.dev`)
      - traefik.http.services.grafan.loadbalancer.server.port=3000 # "grafan" (sic) — matches the running label

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    external: false
