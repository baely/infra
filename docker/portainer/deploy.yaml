# Portainer CE (services.baileys.dev)
name: portainer

services:
  portainer:
    image: portainer/portainer-ce:sts
    container_name: portainer
    restart: always
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`services.baileys.dev`)
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    networks:
      - web

volumes:
  portainer_data:
    external: true # pre-existing volume from the original docker run deployment

networks:
  web:
    external: true
